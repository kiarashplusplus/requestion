name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  functions:
    name: Cloud Functions (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    env:
      # The tests don't render anything, so skip the heavy Chromium download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: npm run lint
      - name: Unit tests
        run: npm test

  python:
    name: Python utility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile cached_query_from_static.py
      - name: Resolve dependencies
        run: python -m pip install --dry-run -r requirements.txt
